servers:
  - url: //localhost:8080
components:
  requestBodies:
    v3.RegisterProjectReq:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/v3.RegisterProjectReq"
      description: 项目配置
      required: true
    v3.SyncProjectReq:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/v3.SyncProjectReq"
      description: 项目参数
      required: true
  securitySchemes:
    BearerAuth:
      in: header
      name: Authorization
      type: apiKey
  schemas:
    domain.FAQTableRecord:
      properties:
        is_resolved:
          type: string
        record:
          additionalProperties: {}
          type: object
        record_id:
          type: string
      type: object
    domain.TableRecord:
      properties:
        record:
          additionalProperties: {}
          type: object
        record_id:
          type: string
      type: object
    domain.TableRecords:
      properties:
        hasMore:
          description: 是否有更多
          type: boolean
        pageToken:
          description: 分页参数
          type: string
        records:
          items:
            $ref: "#/components/schemas/domain.TableRecord"
          type: array
      type: object
    model.ConfigAuditV3:
      properties:
        admin_id:
          type: integer
        change_id:
          type: string
        created_at:
          type: string
        fields:
          type: string
        id:
          type: integer
        kind:
          type: string
        previous_version:
          type: integer
        project_id:
          type: string
        request_id:
          type: string
        result:
          type: string
        version:
          type: integer
      type: object
    response.Response:
      properties:
        code:
          type: integer
        data: {}
        msg:
          type: string
      type: object
    service.ProjectConfigStatusV3:
      properties:
        applied_version:
          type: integer
        confirmed_at:
          type: string
        error_class:
          type: string
        instance_id:
          type: string
        invalidated_at:
          type: string
        last_event_id:
          type: string
        loaded_at:
          type: string
        project_id:
          type: string
        required_version:
          type: integer
        state:
          type: string
        target_version:
          type: integer
      type: object
    v1.CreatTableRecordReg:
      properties:
        contact_info:
          description: 联系方式，可选
          type: string
        content:
          description: 反馈内容
          type: string
        extra_record:
          additionalProperties: {}
          description: 额外记录列表，可选
          type: object
        images:
          description: 图片附件 URL 列表，可选
          items:
            type: string
          type: array
        student_id:
          description: 学号，用于标记用户身份
          type: string
        table_identify:
          type: string
      required:
        - content
        - student_id
        - table_identify
      type: object
    v1.CreatTableRecordResp:
      properties:
        record_id:
          type: string
      type: object
    v1.FAQResolutionUpdateReq:
      properties:
        is_resolved:
          type: boolean
        record_id:
          type: string
        resolved_field_name:
          type: string
        table_identify:
          type: string
        unresolved_field_name:
          type: string
        user_id:
          type: string
      required:
        - is_resolved
        - record_id
        - resolved_field_name
        - table_identify
        - unresolved_field_name
        - user_id
      type: object
    v1.GenerateTableTokenReq:
      properties:
        table_identify:
          description: 反馈表格 Identify，反馈表的唯一标识
          type: string
      required:
        - table_identify
      type: object
    v1.GenerateTableTokenResp:
      properties:
        access_token:
          type: string
      type: object
    v1.GenerateTenantToken:
      properties:
        access_token:
          type: string
      type: object
    v1.GetTableRecordByRecordIdResp:
      properties:
        record:
          additionalProperties: {}
          type: object
      type: object
    v1.GetTableRecordResp:
      properties:
        has_more:
          type: boolean
        page_token:
          type: string
        records:
          items:
            $ref: "#/components/schemas/domain.TableRecord"
          type: array
        total:
          type: integer
      type: object
    v1.HealthCheckResponse:
      properties:
        process:
          allOf:
            - $ref: "#/components/schemas/v1.ProcessStats"
          description: Process 当前进程的运行状态
        response_ms:
          description: ResponseMs 响应耗时，单位毫秒
          type: string
        status:
          description: Status 服务状态，例如 "ok"
          type: string
        system:
          allOf:
            - $ref: "#/components/schemas/v1.SystemStats"
          description: System 系统资源使用情况
      type: object
    v1.ProcessStats:
      properties:
        cpu_percent:
          description: CPUPercent 进程 CPU 使用率（%）
          type: string
        go_heap_alloc_mb:
          description: GoHeapAllocMB Go 堆分配的内存（MB）
          type: string
        goroutines:
          description: Goroutines 当前运行的 goroutine 数
          type: string
        memory_rss_mb:
          description: MemoryRSSMB 进程常驻内存（MB）
          type: string
      type: object
    v1.SystemStats:
      properties:
        cpu_percent:
          description: CPUPercent CPU 使用率（%）
          type: string
        disk_percent:
          description: DiskPercent 磁盘使用率（%）
          type: string
        disk_total:
          description: DiskTotalGB 磁盘总量（GB）
          type: string
        disk_used:
          description: DiskUsedGB 已使用磁盘（GB）
          type: string
        memory_percent:
          description: MemoryPercent 内存使用率（%）
          type: string
        memory_total:
          description: MemoryTotalMB 内存总量（MB）
          type: string
        memory_used:
          description: MemoryUsedMB 已使用内存（MB）
          type: string
      type: object
    v1.TriggerNotificationReq:
      properties:
        table_identify:
          description: 反馈表格 Identify，反馈表的唯一标识
          type: string
      required:
        - table_identify
      type: object
    v2.FAQResolutionUpdateReq:
      properties:
        is_resolved:
          type: boolean
