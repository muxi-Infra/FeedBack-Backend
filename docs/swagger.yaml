basePath: /
definitions:
  domain.FAQTableRecord:
    properties:
      is_resolved:
        type: string
      record:
        additionalProperties: {}
        type: object
      record_id:
        type: string
    type: object
  domain.TableRecord:
    properties:
      record:
        additionalProperties: {}
        type: object
      record_id:
        type: string
    type: object
  response.Response:
    properties:
      code:
        type: integer
      data: {}
      msg:
        type: string
    type: object
  v1.AdminLoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  v1.AdminLoginResponse:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      token_type:
        type: string
      user:
        $ref: '#/definitions/v1.AdminUserResponse'
    type: object
  v1.AdminUserResponse:
    properties:
      created_at:
        type: string
      display_name:
        type: string
      id:
        type: integer
      last_login_at:
        type: string
      status:
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
  v1.ChangeAdminPasswordReq:
    properties:
      current_password:
        type: string
      new_password:
        type: string
    required:
    - current_password
    - new_password
    type: object
  v1.CreatTableRecordReg:
    properties:
      contact_info:
        description: 联系方式，可选
        type: string
      content:
        description: 反馈内容
        type: string
      extra_record:
        additionalProperties: {}
        description: 额外记录列表，可选
        type: object
      images:
        description: 图片附件 URL 列表，可选
        items:
          type: string
        type: array
      table_identify:
        type: string
    required:
    - content
    - table_identify
    type: object
  v1.CreatTableRecordResp:
    properties:
      record_id:
        type: string
    type: object
  v1.CreateAdminReq:
    properties:
      display_name:
        type: string
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  v1.ExchangeIntegrationTokenReq:
    properties:
      key_id:
        type: string
      nonce:
        type: string
      project_id:
        type: string
      signature:
        type: string
      student_id:
        type: string
      table_identity:
        type: string
      timestamp:
        type: integer
    required:
    - key_id
    - nonce
    - project_id
    - signature
    - student_id
    - table_identity
    - timestamp
    type: object
  v1.ExchangeIntegrationTokenResp:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      token_type:
        type: string
    type: object
  v1.FAQResolutionUpdateReq:
    properties:
      is_resolved:
        type: boolean
      record_id:
        type: string
      resolved_field_name:
        type: string
      table_identify:
        type: string
      unresolved_field_name:
        type: string
    required:
    - is_resolved
    - record_id
    - resolved_field_name
    - table_identify
    - unresolved_field_name
    type: object
  v1.GenerateTenantToken:
    properties:
      access_token:
        type: string
    type: object
  v1.GetTableRecordByRecordIdResp:
    properties:
      record:
        additionalProperties: {}
        type: object
    type: object
  v1.GetTableRecordResp:
    properties:
      has_more:
        type: boolean
      page_token:
        type: string
      records:
        items:
          $ref: '#/definitions/domain.TableRecord'
        type: array
      total:
        type: integer
    type: object
  v1.HealthCheckResponse:
    properties:
      process:
        allOf:
        - $ref: '#/definitions/v1.ProcessStats'
        description: Process 当前进程的运行状态
      response_ms:
        description: ResponseMs 响应耗时，单位毫秒
        type: string
      status:
        description: Status 服务状态，例如 "ok"
        type: string
      system:
        allOf:
        - $ref: '#/definitions/v1.SystemStats'
        description: System 系统资源使用情况
    type: object
  v1.ProcessStats:
    properties:
      cpu_percent:
        description: CPUPercent 进程 CPU 使用率（%）
        type: string
      go_heap_alloc_mb:
        description: GoHeapAllocMB Go 堆分配的内存（MB）
        type: string
      goroutines:
        description: Goroutines 当前运行的 goroutine 数
        type: string
      memory_rss_mb:
        description: MemoryRSSMB 进程常驻内存（MB）
        type: string
    type: object
  v1.ProjectConfigResponse:
    properties:
      keys:
        items:
          $ref: '#/definitions/v1.ProjectKeyResponse'
        type: array
      project:
        $ref: '#/definitions/v1.ProjectResponse'
      tables:
        items:
          $ref: '#/definitions/v1.ProjectTableResponse'
        type: array
    type: object
  v1.ProjectKeyResponse:
    properties:
      api_key:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      issuer:
        type: string
      key_id:
        type: string
      project_id:
        type: string
      status:
        type: string
    type: object
  v1.ProjectResponse:
    properties:
      created_at:
        type: string
      id:
        type: integer
      project_id:
        type: string
      project_name:
        type: string
      school:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  v1.ProjectTableResponse:
    properties:
      id:
        type: integer
      notice:
        type: boolean
      project_id:
        type: string
      scopes:
        items:
          type: string
        type: array
      status:
        type: string
      table_id:
        type: string
      table_identity:
        type: string
      table_name:
        type: string
      table_token:
        type: string
      table_type:
        type: string
      view_id:
        type: string
    type: object
  v1.RegisterProjectKeyReq:
    properties:
      api_key:
        type: string
      expires_at:
        type: string
      issuer:
        type: string
      key_id:
        type: string
    required:
    - issuer
    - key_id
    type: object
  v1.RegisterProjectReq:
    properties:
      key:
        $ref: '#/definitions/v1.RegisterProjectKeyReq'
      project_id:
        type: string
      project_name:
        type: string
      school:
        type: string
      status:
        type: string
      tables:
        items:
          $ref: '#/definitions/v1.RegisterProjectTableReq'
        minItems: 1
        type: array
    required:
    - key
    - project_id
    - project_name
    - school
    - tables
    type: object
  v1.RegisterProjectTableReq:
    properties:
      notice:
        type: boolean
      scopes:
        items:
          type: string
        minItems: 1
        type: array
      table_id:
        type: string
      table_identity:
        type: string
      table_name:
        type: string
      table_token:
        type: string
      table_type:
        type: string
      view_id:
        type: string
    required:
    - scopes
    - table_id
    - table_identity
    - table_name
    - table_token
    - view_id
    type: object
  v1.SystemStats:
    properties:
      cpu_percent:
        description: CPUPercent CPU 使用率（%）
        type: string
      disk_percent:
        description: DiskPercent 磁盘使用率（%）
        type: string
      disk_total:
        description: DiskTotalGB 磁盘总量（GB）
        type: string
      disk_used:
        description: DiskUsedGB 已使用磁盘（GB）
        type: string
      memory_percent:
        description: MemoryPercent 内存使用率（%）
        type: string
      memory_total:
        description: MemoryTotalMB 内存总量（MB）
        type: string
      memory_used:
        description: MemoryUsedMB 已使用内存（MB）
        type: string
    type: object
  v1.TriggerNotificationReq:
    properties:
      project_id:
        description: 项目标识
        type: string
      table_identify:
        description: 反馈表格 Identify，反馈表的唯一标识
        type: string
    required:
    - project_id
    - table_identify
    type: object
  v1.UpdateAdminStatusReq:
    properties:
      status:
        type: string
    required:
    - status
    type: object
  v1.UpdateProjectConfigReq:
    properties:
      key:
        $ref: '#/definitions/v1.RegisterProjectKeyReq'
      project_name:
        type: string
      school:
        type: string
      status:
        type: string
      tables:
        items:
          $ref: '#/definitions/v1.RegisterProjectTableReq'
        minItems: 1
        type: array
    required:
    - key
    - project_name
    - school
    - status
    - tables
    type: object
  v1.UpdateProjectReq:
    properties:
      project_name:
        type: string
      school:
        type: string
      status:
        type: string
    type: object
  v2.FAQResolutionUpdateReq:
    properties:
      is_resolved:
        type: boolean
      record_id:
        type: string
      table_identify:
        type: string
    required:
    - is_resolved
    - record_id
    - table_identify
    type: object
  v2.ForceSyncTableRecordsReq:
    properties:
      table_identify:
        type: string
    required:
    - table_identify
    type: object
  v2.ForceSyncTableRecordsResp:
    properties:
      queue_full:
        description: 队列是否已满
        type: boolean
      record_ids:
        description: 成功投递到队列的记录 ID
        items:
          type: string
        type: array
      total:
        description: 本次尝试同步的总记录数
        type: integer
    type: object
  v2.ForceSyncUserTableRecordsReq:
    properties:
      table_identify:
        type: string
    required:
    - table_identify
    type: object
  v2.ForceSyncUserTableRecordsResp:
    properties:
      queue_full:
        description: 队列是否已满
        type: boolean
      record_ids:
        description: 成功投递到队列的记录 ID
        items:
          type: string
        type: array
      total:
        description: 本次尝试同步的总记录数
        type: integer
    type: object
  v2.GetTableRecordByRecordIdResp:
    properties:
      records:
        items:
          $ref: '#/definitions/domain.FAQTableRecord'
        type: array
    type: object
  v2.GetTableRecordResp:
    properties:
      has_more:
        type: boolean
      page_token:
        type: string
      records:
        items:
          $ref: '#/definitions/domain.TableRecord'
        type: array
    type: object
  v2.SyncFaqRecordReq:
    properties:
      table_identify:
        type: string
    required:
    - table_identify
    type: object
  v2.SyncUnsyncedTableRecordsReq:
    properties:
      table_identify:
        type: string
    required:
    - table_identify
    type: object
  v2.SyncUnsyncedTableRecordsResp:
    properties:
      queue_full:
        description: 队列是否已满
        type: boolean
      record_ids:
        description: 成功投递到队列的记录 ID
        items:
          type: string
        type: array
      total:
        description: 本次尝试同步的总记录数
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  title: 木犀反馈系统 API
  version: "1.0"
paths:
  /api/v1/admin/login:
    post:
      consumes:
      - application/json
      description: 校验管理员账号和密码，返回 Admin JWT。
      parameters:
      - description: 管理员登录信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.AdminLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.AdminLoginResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
      summary: 管理员登录
      tags:
      - Admin Auth
  /api/v1/admin/users:
    post:
      consumes:
      - application/json
      description: 创建新的管理后台账号，需要具备 admin:create 权限。
      parameters:
      - description: Bearer Admin JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 管理员信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.CreateAdminReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.AdminUserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Response'
      summary: 创建管理员
      tags:
      - Admin
  /api/v1/admin/users/{admin_id}:
    get:
      description: 根据管理员 ID 查询账号信息，需要具备 admin:read 权限。
      parameters:
      - description: Bearer Admin JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 管理员 ID
        format: int64
        in: path
        name: admin_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.AdminUserResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: 查询管理员
      tags:
      - Admin
  /api/v1/admin/users/{admin_id}/status:
    patch:
      consumes:
      - application/json
      description: 启用、锁定或禁用管理员账号，需要具备 admin:update 权限。
      parameters:
      - description: Bearer Admin JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 管理员 ID
        format: int64
        in: path
        name: admin_id
        required: true
        type: integer
      - description: 管理员状态
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateAdminStatusReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: 修改管理员状态
      tags:
      - Admin
  /api/v1/auth/tenant/token:
    post:
      consumes:
      - application/json
      description: 获取飞书应用的租户访问令牌，主要用于文件上传、图片处理等需要应用级权限的操作。该令牌具有较高的访问权限。
      operationId: get-tenant-token
      produces:
      - application/json
      responses:
        "200":
          description: 成功返回 JWT 令牌
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.GenerateTenantToken'
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/response.Response'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取租户访问令牌
      tags:
      - Auth
  /api/v1/health:
    get:
      consumes:
      - application/json
      description: 检查系统运行状态，返回服务健康信息、资源使用情况等监控数据。用于负载均衡器健康检查和系统监控。
      operationId: health-check
      produces:
      - application/json
      responses:
        "200":
          description: 系统运行正常，返回健康检查详情
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.HealthCheckResponse'
              type: object
        "500":
          description: 系统异常或部分服务不可用
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  type: string
              type: object
      summary: 系统健康检查
      tags:
      - Health
  /api/v1/integrations/projects:
    get:
      parameters:
      - description: Bearer Admin JWT
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/v1.ProjectResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取项目列表
      tags:
      - Integration Admin
    post:
      consumes:
      - application/json
      description: 登记项目 API Key、飞书反馈表和表级 scope。接口仅允许管理员访问；新生成的 API Key 只在注册响应中返回一次。
      parameters:
      - description: Bearer Admin JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 项目配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.RegisterProjectReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.ProjectConfigResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/response.Response'
      summary: 注册反馈项目
      tags:
      - Integration Admin
  /api/v1/integrations/projects/{project_id}:
    delete:
      parameters:
      - description: Bearer Admin JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 项目 ID
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: 删除项目
      tags:
      - Integration Admin
    get:
      parameters:
      - description: Bearer Admin JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 项目 ID
        in: path
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Response'
            - properties:
                data:
                  $ref: '#/definitions/v1.ProjectConfigResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: 获取项目配置
      tags:
      - Integration Admin
    put:
      consumes:
      - application/json
      parameters:
      - description: Bearer Admin JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 项目 ID
        in: path
        name: project_id
        required: true
        type: string
      - description: 项目基本信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateProjectReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Response'
      summary: 更新项目
      tags:
      - Integration Admin
  /api/v1/integrations/projects/{project_id}/config:
    put:
      consumes:
      - application/json
      description: 一次性替换项目基本信息、API Key、飞书表配置和表级 Scope。未提交的旧 API Key 或表配置会被软删除。
      parameters:
      - description: Bearer Admin JWT
        in: header
        name: Authorization
        required: true
        type: string
      - description: 项目 ID
        in: path
        name: project_id
        required: true
        type: string
      - description: 完整项目配置
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/v1.UpdateProjectConfigReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
        "400":
          description: Bad Request
          schema:
